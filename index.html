<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>خير الطبيعة - إدارة الأرانب</title>
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4CAF82">
<style>
:root{
  box-sizing:border-box;
  --bg:#F3F7F1;
  --surface:#FFFFFF;
  --primary:#4CAF82;
  --primary-dark:#2E7D5B;
  --primary-tint:#E3F4EB;
  --ink:#1F2B24;
  --muted:#6B7A72;
  --alert:#C77B4A;
  --alert-tint:#FBEEE4;
  --danger:#C0524A;
  --line:#DCE6DF;
  --radius:14px;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
body{
  font-family:'Cairo',system-ui,sans-serif;
  background:var(--bg);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
.app{display:flex;min-height:100vh;}

/* Sidebar */
.sidebar{
  width:230px;flex:0 0 230px;
  background:var(--primary-dark);
  color:#fff;
  padding:22px 16px;
  position:sticky;top:0;height:100vh;overflow-y:auto;
}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:26px;padding:0 6px;}
.brand-mark{width:36px;height:36px;border-radius:10px;background:var(--primary);display:flex;align-items:center;justify-content:center;font-size:18px;flex:0 0 36px;}
.brand-text{font-weight:800;font-size:26px;line-height:1.2;}
.brand-sub{font-size:11px;opacity:.75;font-weight:400;}
nav{display:flex;flex-direction:column;gap:4px;}
.nav-item{
  display:flex;align-items:center;gap:10px;
  padding:11px 12px;border-radius:10px;
  color:#EAF5EF;text-decoration:none;font-size:14.5px;font-weight:600;
  cursor:pointer;border:none;background:transparent;text-align:right;width:100%;
  transition:background .15s;
}
.nav-item .ico{font-size:16px;width:20px;text-align:center;}
.nav-item:hover{background:rgba(255,255,255,.08);}
.nav-item.active{background:var(--primary);color:#fff;}
.nav-badge{margin-right:auto;background:var(--alert);color:#fff;font-size:11px;font-weight:800;border-radius:20px;padding:1px 7px;min-width:18px;text-align:center;}

/* Main */
main{flex:1;padding:26px 30px 60px;max-width:100%;overflow-x:hidden;}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:12px;}
.topbar h1{font-size:22px;font-weight:800;margin:0;}
.topbar p{margin:2px 0 0;color:var(--muted);font-size:13.5px;}
.btn{
  display:inline-flex;align-items:center;gap:6px;
  background:var(--primary);color:#fff;border:none;
  padding:10px 18px;border-radius:10px;font-family:inherit;
  font-weight:700;font-size:14px;cursor:pointer;transition:background .15s, transform .1s;
}
.btn:hover{background:var(--primary-dark);}
.btn:active{transform:scale(.97);}
.btn.secondary{background:var(--surface);color:var(--primary-dark);border:1.5px solid var(--line);}
.btn.secondary:hover{background:var(--primary-tint);}
.btn.danger-outline{background:#fff;color:var(--danger);border:1.5px solid #EAD1CE;}
.btn.danger-outline:hover{background:#FBEFEE;}
.btn.small{padding:6px 12px;font-size:13px;}

/* Cards & Grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin-bottom:8px;}
.stat-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;}
.stat-card .num{font-size:26px;font-weight:800;color:var(--primary-dark);}
.stat-card .lbl{font-size:13px;color:var(--muted);margin-top:2px;}

.section{margin-top:30px;}
.section-title{font-size:15px;font-weight:800;margin:0 0 12px;display:flex;align-items:center;gap:8px;}

.mother-row{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:10px;cursor:pointer;transition:box-shadow .15s;}
.mother-row:hover{box-shadow:0 4px 14px rgba(46,125,91,.12);}
.mother-row-photo{width:52px;height:52px;border-radius:12px;flex:0 0 52px;background:var(--primary-tint) center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:var(--primary-dark);font-size:22px;}
.mother-row-info{flex:1;min-width:0;}
.mother-row-name{font-weight:800;font-size:19px;}
.mother-row-meta{font-size:14px;color:var(--muted);margin-top:2px;}
.status-chip{display:inline-block;font-size:12px;font-weight:800;padding:3px 11px;border-radius:20px;}
.status-chip.ok{background:var(--primary-tint);color:var(--primary-dark);}
.status-chip.alert{background:var(--alert-tint);color:var(--alert);}

.empty{background:var(--surface);border:1.5px dashed var(--line);border-radius:var(--radius);padding:36px 20px;text-align:center;color:var(--muted);font-size:14px;}

/* Alerts Feed */
.alert-item{
  display:flex;gap:12px;align-items:flex-start;
  background:var(--surface);border:1px solid var(--line);border-right:4px solid var(--alert);
  border-radius:12px;padding:12px 14px;margin-bottom:10px;
}
.alert-item .ico{font-size:18px;}
.alert-item .txt{flex:1;font-size:13.5px;line-height:1.5;}
.alert-item .txt b{font-weight:800;}
.alert-item .date{font-size:12px;color:var(--muted);margin-top:2px;}

/* Modal & Form */
.overlay{position:fixed;inset:0;background:rgba(20,30,24,.45);display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;z-index:50;}
.overlay.open{display:flex;}
.modal{background:var(--surface);border-radius:16px;width:100%;max-width:560px;padding:22px 24px 26px;box-shadow:0 20px 50px rgba(0,0,0,.2);}
.modal h2{margin:0 0 4px;font-size:18px;font-weight:800;}
.modal .sub{color:var(--muted);font-size:13px;margin:0 0 18px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px;color:var(--ink);}
.field input, .field textarea, .field select{
  width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;
  font-family:inherit;font-size:14px;background:#fff;color:var(--ink);
}
.field input:focus, .field textarea:focus, .field select:focus{outline:2px solid var(--primary);outline-offset:1px;border-color:var(--primary);}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.modal-actions{display:flex;gap:10px;margin-top:18px;justify-content:flex-end;}

table{width:100%;border-collapse:collapse;background:var(--surface);border-radius:12px;overflow:hidden;border:1px solid var(--line);}
th,td{padding:10px 12px;text-align:right;font-size:13.5px;border-bottom:1px solid var(--line);}
th{background:var(--primary-tint);color:var(--primary-dark);font-weight:800;}
tr:last-child td{border-bottom:none;}
.table-wrap{overflow-x:auto;border-radius:12px;}

.toast-wrap{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;align-items:center;}
.toast{background:var(--ink);color:#fff;padding:10px 18px;border-radius:30px;font-size:13.5px;font-weight:700;box-shadow:0 8px 20px rgba(0,0,0,.2);}

.mobile-brand{display:none;}

@media (max-width:760px){
  .app{flex-direction:column;}
  .grid{grid-template-columns:repeat(2,1fr);gap:10px;}
  .stat-card{padding:12px 10px;}
  .stat-card .num{font-size:22px;}
  .stat-card .lbl{font-size:11.5px;}
  .mobile-brand{
    display:flex;align-items:center;justify-content:center;gap:8px;
    padding:10px 14px calc(10px + env(safe-area-inset-top,0px));
    background:var(--primary-dark);color:#fff;
    font-weight:800;font-size:24px;letter-spacing:.3px;
  }
  .sidebar{display:none;}
  .bottom-nav{display:block;}
  main{padding:16px 14px calc(96px + env(safe-area-inset-bottom,0px));}
  .field-row{grid-template-columns:1fr;}
  .topbar{position:sticky;top:0;background:var(--bg);padding-top:4px;z-index:10;}
}

/* Bottom Nav */
.bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:45;
  background:var(--surface);border-top:1px solid var(--line);
  padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));
  box-shadow:0 -6px 18px rgba(0,0,0,.06);}
.bottom-nav-inner{display:flex;overflow-x:auto;gap:2px;}
.bn-item{flex:1 0 auto;min-width:62px;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:7px 4px;border-radius:12px;background:transparent;border:none;font-family:inherit;
  color:var(--muted);font-size:10.5px;font-weight:700;cursor:pointer;}
.bn-item .ico{font-size:19px;line-height:1;}
.bn-item.active{color:var(--primary-dark);background:var(--primary-tint);}
</style>
</head>
<body>
<div class="app">

  <div class="mobile-brand">🐇 <span>خير الطبيعة</span></div>

  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark">🐇</div>
      <div>
        <div class="brand-text">خير الطبيعة</div>
        <div class="brand-sub">إدارة الأرانب</div>
      </div>
    </div>
    <nav id="navList"></nav>
  </aside>

  <main>
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:10px;">
        <div>
          <h1 id="pageTitle">الرئيسية</h1>
          <p id="pageSub">نظرة عامة على المزرعة</p>
        </div>
      </div>
      <div id="topbarActions"></div>
      <div style="display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted);margin-top:6px;">نسخة التطبيق <strong id="appVersion">2.1.0</strong></div>
    </div>
    <div id="content"></div>
  </main>
</div>

<nav class="bottom-nav" id="bottomNav">
  <div class="bottom-nav-inner" id="bottomNavInner"></div>
</nav>

<div class="overlay" id="overlay">
  <div class="modal" id="modalBody"></div>
</div>

<div class="toast-wrap" id="toastWrap"></div>

<script>
/* ======================= DATA LAYER ======================= */
const APP_VERSION = '2.1.0';
const DB_KEY = 'rabbitFarmDB_v1';
function loadDB(){
  try{
    const raw = localStorage.getItem(DB_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return { mothers:[], males:[], matings:[], fattening:[], vaccinations:[], finance:[], settings:{whatsapp:'201095222441'} };
}
function saveDB(){
  try{ localStorage.setItem(DB_KEY, JSON.stringify(DB)); }catch(e){ toast('تعذر الحفظ محليًا'); }
}
let DB = loadDB();
if(!DB.settings) DB.settings = {whatsapp:'201095222441'};
if(!DB.finance) DB.finance = [];

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function todayISO(){ return new Date().toISOString().slice(0,10); }

function fmtDate(d){
  if(!d) return '—';
  const dt = new Date(d);
  return dt.toLocaleDateString('ar-EG',{day:'numeric',month:'short',year:'numeric'});
}

function toast(msg){
  const el = document.createElement('div');
  el.className='toast'; el.textContent=msg;
  document.getElementById('toastWrap').appendChild(el);
  setTimeout(()=>el.remove(),2600);
}

function openSettings(){
  openModal(`
    <h2>⚙️ الإعدادات</h2>
    <div class="field">
      <label>رقم الواتساب لاستقبال التنبيهات</label>
      <input id="f_whatsapp" value="${DB.settings.whatsapp||''}" placeholder="مثال: 201095222441" inputmode="numeric">
    </div>
    <div class="modal-actions">
      <button class="btn secondary" onclick="closeModal()">إلغاء</button>
      <button class="btn" onclick="saveSettings()">حفظ</button>
    </div>
  `);
}

function saveSettings(){
  const wa = document.getElementById('f_whatsapp').value.trim();
  if(!wa){ toast('اكتب رقم الواتساب'); return; }
  DB.settings.whatsapp = wa;
  saveDB(); closeModal();
  toast('اتحفظت الإعدادات ✅');
}

/* Navigation */
const PAGES = [
  {id:'dashboard', label:'الرئيسية', ico:'🏠'},
  {id:'mothers', label:'الأمهات', ico:'🐰'},
  {id:'males', label:'الذكور', ico:'♂️'},
  {id:'matings', label:'التلقيح', ico:'❤️'},
  {id:'fattening', label:'التسمين', ico:'📈'},
  {id:'finance', label:'الحسابات والمالية', ico:'💰'},
];
let currentPage = 'dashboard';

function renderNav(){
  const nav = document.getElementById('navList');
  nav.innerHTML = '';
  PAGES.forEach(p=>{
    const btn = document.createElement('button');
    btn.className = 'nav-item' + (p.id===currentPage?' active':'');
    btn.innerHTML = `<span class="ico">${p.ico}</span><span>${p.label}</span>`;
    btn.onclick = ()=>{ currentPage = p.id; render(); };
    nav.appendChild(btn);
  });
}

function renderBottomNav(){
  const wrap = document.getElementById('bottomNavInner');
  wrap.innerHTML = '';
  PAGES.forEach(p=>{
    const btn = document.createElement('button');
    btn.className = 'bn-item' + (p.id===currentPage?' active':'');
    btn.innerHTML = `<span class="ico">${p.ico}</span><span>${p.label}</span>`;
    btn.onclick = ()=>{ currentPage = p.id; render(); window.scrollTo(0,0); };
    wrap.appendChild(btn);
  });
}

function openModal(html){
  document.getElementById('modalBody').innerHTML = html;
  document.getElementById('overlay').classList.add('open');
}
function closeModal(){
  document.getElementById('overlay').classList.remove('open');
}

/* Main Render */
function render(){
  renderNav();
  renderBottomNav();
  const meta = PAGES.find(p=>p.id===currentPage);
  document.getElementById('pageTitle').textContent = meta.label;

  const actions = document.getElementById('topbarActions');
  actions.innerHTML = '';
  if(currentPage==='dashboard') actions.innerHTML = `<button class="btn secondary" onclick="openSettings()">⚙️ الإعدادات</button>`;
  else if(currentPage==='finance') actions.innerHTML = `<button class="btn" onclick="openFinanceForm()">+ إضافة بند جديد</button>`;

  const c = document.getElementById('content');
  if(currentPage==='dashboard') c.innerHTML = renderDashboard();
  else if(currentPage==='finance') c.innerHTML = renderFinance();
  else c.innerHTML = `<div class="empty">قسم ${meta.label} جاهز للمتابعة.</div>`;
}

function renderDashboard(){
  return `
    <div class="grid">
      <div class="stat-card"><div class="num">${DB.mothers.length}</div><div class="lbl">إجمالي الأمهات</div></div>
      <div class="stat-card"><div class="num">${DB.males.length}</div><div class="lbl">إجمالي الذكور</div></div>
    </div>`;
}

/* ======================= FINANCE MODULE ======================= */
function renderFinance() {
  if (!DB.finance) DB.finance = [];

  const totalIncome = DB.finance
    .filter(item => item.type === 'income')
    .reduce((sum, item) => sum + Number(item.amount || 0), 0);

  const totalExpense = DB.finance
    .filter(item => item.type === 'expense')
    .reduce((sum, item) => sum + Number(item.amount || 0), 0);

  const netProfit = totalIncome - totalExpense;
  const isProfit = netProfit >= 0;

  return `
    <div class="grid" style="margin-bottom:20px;">
      <div class="stat-card" style="border-top:4px solid var(--primary);">
        <div class="num" style="color:var(--primary-dark);">${totalIncome.toLocaleString('ar-EG')} ج.م</div>
        <div class="lbl">إجمالي الإيرادات 📈</div>
      </div>
      <div class="stat-card" style="border-top:4px solid var(--danger);">
        <div class="num" style="color:var(--danger);">${totalExpense.toLocaleString('ar-EG')} ج.م</div>
        <div class="lbl">إجمالي المصروفات 📉</div>
      </div>
      <div class="stat-card" style="border-top:4px solid ${isProfit ? 'var(--primary)' : 'var(--danger)'};">
        <div class="num" style="color:${isProfit ? 'var(--primary-dark)' : 'var(--danger)'};">
          ${netProfit.toLocaleString('ar-EG')} ج.م
        </div>
        <div class="lbl">${isProfit ? 'صافي الربح (كسبان) 🎉' : 'صافي الخسارة (خسران) ⚠️'}</div>
      </div>
    </div>

    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
      <h3 style="margin:0;font-size:16px;">سجل حركة الخزينة</h3>
      <button class="btn" onclick="openFinanceForm()">+ إضافة بند جديد</button>
    </div>

    ${DB.finance.length === 0 ? `
      <div class="empty">لا توجد معاملات مالية مسجلة حتى الآن.</div>
    ` : `
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>التاريخ</th>
              <th>النوع</th>
              <th>البيان / التفاصيل</th>
              <th>المبلغ</th>
              <th>إجراء</th>
            </tr>
          </thead>
          <tbody>
            ${DB.finance.slice().reverse().map(item => `
              <tr>
                <td>${fmtDate(item.date)}</td>
                <td>
                  <span class="status-chip ${item.type === 'income' ? 'ok' : 'alert'}" style="${item.type === 'expense' ? 'background:#FBEFEE;color:var(--danger);' : ''}">
                    ${item.type === 'income' ? 'إيراد +' : 'مصروف -'}
                  </span>
                </td>
                <td><b>${item.title}</b></td>
                <td style="font-weight:800;color:${item.type === 'income' ? 'var(--primary-dark)' : 'var(--danger)'}">
                  ${item.type === 'income' ? '+' : '-'}${Number(item.amount).toLocaleString('ar-EG')} ج.م
                </td>
                <td>
                  <button class="btn danger-outline small" onclick="deleteFinanceItem('${item.id}')">حذف</button>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    `}
  `;
}

function openFinanceForm() {
  openModal(`
    <h2>💰 إضافة بند جديد للخزينة</h2>
    <p class="sub">حدد نوع المعاملة والمبلغ لتحديث إجمالي الأرباح تلقائياً.</p>
    
    <div class="field">
      <label>نوع البند</label>
      <select id="f_fin_type">
        <option value="income">📈 إيراد (دخل للمزرعة)</option>
        <option value="expense">📉 مصروف (خرج من المزرعة)</option>
      </select>
    </div>

    <div class="field">
      <label>المبلغ (بالجنيه)</label>
      <input type="number" id="f_fin_amount" placeholder="مثال: 550" inputmode="decimal">
    </div>

    <div class="field">
      <label>البيان / الوصف</label>
      <input type="text" id="f_fin_title" placeholder="مثال: بيع دفعة تسمين / شراء شكاير علف">
    </div>

    <div class="field">
      <label>التاريخ</label>
      <input type="date" id="f_fin_date" value="${todayISO()}">
    </div>

    <div class="modal-actions">
      <button class="btn secondary" onclick="closeModal()">إلغاء</button>
      <button class="btn" onclick="saveFinanceItem()">حفظ البند</button>
    </div>
  `);
}

function saveFinanceItem() {
  const type = document.getElementById('f_fin_type').value;
  const amount = parseFloat(document.getElementById('f_fin_amount').value);
  const title = document.getElementById('f_fin_title').value.trim();
  const date = document.getElementById('f_fin_date').value;

  if (!amount || amount <= 0) {
    toast('يرجى إدخال مبلغ صحيح');
    return;
  }
  if (!title) {
    toast('يرجى كتابة بيان البند');
    return;
  }

  if (!DB.finance) DB.finance = [];
  
  DB.finance.push({
    id: uid(),
    type,
    amount,
    title,
    date: date || todayISO()
  });

  saveDB();
  closeModal();
  render();
  toast('تم حفظ البند بنجاح ✅');
}

function deleteFinanceItem(id) {
  if (!confirm('هل أنت تأكد من حذف هذا البند؟')) return;
  DB.finance = DB.finance.filter(item => item.id !== id);
  saveDB();
  render();
  toast('تم حذف البند');
}

render();
</script>
</body>
</html>
